ext x="48" y="1044" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A8A91" letter-spacing="2">V3 · SHOT 29 — THE CHANNEL KEEPS POSTING</text><text x="1872" y="1044" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A8A91" text-anchor="end" letter-spacing="2">1:11 · 2.5 S · CLOSE</text></g></g><rect x="80" y="140" width="840" height="472.5" rx="10" fill="none" stroke="#35353C" stroke-width="1"/><text x="80" y="656.5" font-family="IBM Plex Mono" font-size="26" font-weight="500" fill="#3EAF75">29</text><text x="132" y="656.5" font-family="Bricolage Grotesque" font-size="26" font-weight="700" fill="#F2F2F0" letter-spacing="-0.5">The channel keeps posting</text><text x="920" y="656.5" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#8A8A91" text-anchor="end">1:11 · 2.5 s</text><text x="80" y="692.5" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#8A8A91" letter-spacing="2">VISUAL</text><text x="170" y="692.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">Bright gradient, one calm line: &quot;The channel keeps posting. Every week.&quot; with &quot;Every</text><text x="170" y="714.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">week.&quot; in brew green.</text><text x="80" y="744.5" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#8A8A91" letter-spacing="2">MOTION</text><text x="170" y="744.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">Words fade in spaced wide, then tracking tightens. Ref: &quot;The system gets smarter —</text><text x="170" y="766.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">forever&quot;.</text><text x="80" y="796.5" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#3EAF75" letter-spacing="2">VO</text><text x="170" y="796.5" font-family="Archivo" font-size="16" font-weight="400" fill="#F2F2F0">&quot;Your channel keeps posting, every week.&quot;</text><text x="80" y="826.5" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#8A8A91" letter-spacing="2">SFX</text><text x="170" y="826.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">Pad + soft pulse.</text><text x="80" y="856.5" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#8A8A91" letter-spacing="2">NEXT</text><text x="170" y="856.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">Cut to white: the contrast lines.</text><g transform="translate(1000 140) scale(0.4375)"><g clip-path="url(#w30-panel)"><rect x="0" y="0" width="1920" height="1080" fill="#F4F4F1"/><ellipse cx="1500" cy="1150" rx="1300" ry="620" fill="url(#w30-rg0)"/><ellipse cx="400" cy="1190" rx="900" ry="420" fill="url(#w30-rg1)"/><ellipse cx="760" cy="360" rx="1100" ry="520" fill="url(#w30-rg2)"/><text x="657.6" y="560" font-family="Archivo" font-size="72" font-weight="500" fill="#0B0B0C">Others hand you a </text><g filter="url(#w30-blur3)"><text x="1266.436" y="560" font-family="Archivo" font-size="72" font-weight="500" fill="#0B0B0C">tool.</text></g><text x="48" y="1044" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A8A91" letter-spacing="2">V3 · SHOT 30 — OTHERS HAND YOU A TOOL.</text><text x="1872" y="1044" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A8A91" text-anchor="end" letter-spacing="2">1:14 · 2.0 S · CLOSE</text></g></g><rect x="1000" y="140" width="840" height="472.5" rx="10" fill="none" stroke="#35353C" stroke-width="1"/><text x="1000" y="656.5" font-family="IBM Plex Mono" font-size="26" font-weight="500" fill="#3EAF75">30</text><text x="1052" y="656.5" font-family="Bricolage Grotesque" font-size="26" font-weight="700" fill="#F2F2F0" letter-spacing="-0.5">Others hand you a tool.</text><text x="1840" y="656.5" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#8A8A91" text-anchor="end">1:14 · 2.0 s</text><text x="1000" y="692.5" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#8A8A91" letter-spacing="2">VISUAL</text><text x="1090" y="692.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">White stage, near-black text: &quot;Others hand you a tool.&quot; &quot;tool&quot; slightly out of focus.</text><text x="1000" y="722.5" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#8A8A91" letter-spacing="2">MOTION</text><text x="1090" y="722.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">Line types on; &quot;tool&quot; drifts out of focus as it lands. Ref: &quot;They close tickets&quot;.</text><text x="1000" y="752.5" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#3EAF75" letter-spacing="2">VO</text><text x="1090" y="752.5" font-family="Archivo" font-size="16" font-weight="400" fill="#F2F2F0">&quot;Others hand you a tool.&quot;</text><text x="1000" y="782.5" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#8A8A91" letter-spacing="2">SFX</text><text x="1090" y="782.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">One dry key click.</text><text x="1000" y="812.5" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#8A8A91" letter-spacing="2">NEXT</text><text x="1090" y="812.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">Line flips to green.</text><g transform="translate(80 980) scale(0.4375)"><g clip-path="url(#w31-panel)"><rect x="0" y="0" width="1920" height="1080" fill="#F4F4F1"/><ellipse cx="1500" cy="1080" rx="1300" ry="620" fill="url(#w31-rg0)"/><ellipse cx="400" cy="1120" rx="900" ry="420" fill="url(#w31-rg1)"/><ellipse cx="760" cy="360" rx="1100" ry="520" fill="url(#w31-rg2)"/><text x="585.7" y="560" font-family="Archivo" font-size="72" font-weight="500" fill="#3EAF75">We hand you the video.</text><text x="48" y="1044" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A8A91" letter-spacing="2">V3 · SHOT 31 — WE HAND YOU THE VIDEO.</text><text x="1872" y="1044" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A8A91" text-anchor="end" letter-spacing="2">1:16 · 2.5 S · CLOSE</text></g></g><rect x="80" y="980" width="840" height="472.5" rx="10" fill="none" stroke="#35353C" stroke-width="1"/><text x="80" y="1496.5" font-family="IBM Plex Mono" font-size="26" font-weight="500" fill="#3EAF75">31</text><text x="132" y="1496.5" font-family="Bricolage Grotesque" font-size="26" font-weight="700" fill="#F2F2F0" letter-spacing="-0.5">We hand you the video.</text><text x="920" y="1496.5" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#8A8A91" text-anchor="end">1:16 · 2.5 s</text><text x="80" y="1532.5" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#8A8A91" letter-spacing="2">VISUAL</text><text x="170" y="1532.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">&quot;We hand you the video.&quot; in brew green on the gradient; &quot;video&quot; sharp, the rest</text><text x="170" y="1554.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">softening.</text><text x="80" y="1584.5" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#8A8A91" letter-spacing="2">MOTION</text><text x="170" y="1584.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">Cross-dissolve from the previous line with a 6 px vertical slide. Ref: &quot;We Eliminate</text><text x="170" y="1606.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">them&quot;.</text><text x="80" y="1636.5" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#3EAF75" letter-spacing="2">VO</text><text x="170" y="1636.5" font-family="Archivo" font-size="16" font-weight="400" fill="#F2F2F0">&quot;We hand you the video.&quot;</text><text x="80" y="1666.5" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#8A8A91" letter-spacing="2">SFX</text><text x="170" y="1666.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">brew signature, soft.</text><text x="80" y="1696.5" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#8A8A91" letter-spacing="2">NEXT</text><text x="170" y="1696.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">Logo resolves on white glow.</text><g transform="translate(1000 980) scale(0.4375)"><g clip-path="url(#w32-panel)"><rect x="0" y="0" width="1920" height="1080" fill="#F4F4F1"/><ellipse cx="1500" cy="1100" rx="1300" ry="620" fill="url(#w32-rg0)"/><ellipse cx="400" cy="1140" rx="900" ry="420" fill="url(#w32-rg1)"/><ellipse cx="760" cy="360" rx="1100" ry="520" fill="url(#w32-rg2)"/><rect x="690" y="450" width="150" height="150" rx="30" fill="#FFFFFF"/><path d="M712 496V472H736M794 472H818V496M818 554V578H794M736 578H712V554" fill="none" stroke="#3EAF75" stroke-width="7" stroke-linecap="square"/><text x="765" y="564" font-family="Bricolage Grotesque" font-size="96" font-weight="800" fill="#3EAF75" text-anchor="middle">e</text><text x="870" y="576" font-family="Bricolage Grotesque" font-size="140" font-weight="800" fill="#0B0B0C" letter-spacing="-5"><tspan>br</tspan><tspan fill="#3EAF75">e</tspan><tspan>w</tspan></text><text x="48" y="1044" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A8A91" letter-spacing="2">V3 · SHOT 32 — LOGO</text><text x="1872" y="1044" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A8A91" text-anchor="end" letter-spacing="2">1:18 · 3.0 S · CLOSE</text></g></g><rect x="1000" y="980" width="840" height="472.5" rx="10" fill="none" stroke="#35353C" stroke-width="1"/><text x="1000" y="1496.5" font-family="IBM Plex Mono" font-size="26" font-weight="500" fill="#3EAF75">32</text><text x="1052" y="1496.5" font-family="Bricolage Grotesque" font-size="26" font-weight="700" fill="#F2F2F0" letter-spacing="-0.5">Logo</text><text x="1840" y="1496.5" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#8A8A91" text-anchor="end">1:18 · 3.0 s</text><text x="1000" y="1532.5" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#8A8A91" letter-spacing="2">VISUAL</text><text x="1090" y="1532.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">White glow. The brew mark and wordmark, side by side, mid-size, calm.</text><text x="1000" y="1562.5" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#8A8A91" letter-spacing="2">MOTION</text><text x="1090" y="1562.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">Mark lands first; letters of &quot;brew&quot; type on (b, r, e, w) with the green &quot;e&quot; last. Ref:</text><text x="1090" y="1584.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">Numtera logo typing on.</text><text x="1000" y="1614.5" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#3EAF75" letter-spacing="2">VO</text><text x="1090" y="1614.5" font-family="Archivo" font-size="16" font-weight="400" fill="#F2F2F0">—</text><text x="1000" y="1644.5" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#8A8A91" letter-spacing="2">SFX</text><text x="1090" y="1644.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">Signature chord, full.</text><text x="1000" y="1674.5" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#8A8A91" letter-spacing="2">NEXT</text><text x="1090" y="1674.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">Cut to black: tagline typed.</text></svg>
