36842106" y="506" font-family="Archivo" font-size="15" font-weight="400" fill="#F2F2F0">CTA</text><text x="80" y="676" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#3EAF75" letter-spacing="2">BREW V3 · 90 S</text><line x1="80" y1="796" x2="80" y2="804" stroke="#35353C" stroke-width="1"/><text x="80" y="824" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#8A8A91" text-anchor="middle">0:00</text><line x1="172.63157894736844" y1="796" x2="172.63157894736844" y2="804" stroke="#35353C" stroke-width="1"/><line x1="265.2631578947369" y1="796" x2="265.2631578947369" y2="804" stroke="#35353C" stroke-width="1"/><text x="265.2631578947369" y="824" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#8A8A91" text-anchor="middle">0:10</text><line x1="357.89473684210526" y1="796" x2="357.89473684210526" y2="804" stroke="#35353C" stroke-width="1"/><line x1="450.5263157894737" y1="796" x2="450.5263157894737" y2="804" stroke="#35353C" stroke-width="1"/><text x="450.5263157894737" y="824" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#8A8A91" text-anchor="middle">0:20</text><line x1="543.1578947368421" y1="796" x2="543.1578947368421" y2="804" stroke="#35353C" stroke-width="1"/><line x1="635.7894736842105" y1="796" x2="635.7894736842105" y2="804" stroke="#35353C" stroke-width="1"/><text x="635.7894736842105" y="824" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#8A8A91" text-anchor="middle">0:30</text><line x1="728.421052631579" y1="796" x2="728.421052631579" y2="804" stroke="#35353C" stroke-width="1"/><line x1="821.0526315789474" y1="796" x2="821.0526315789474" y2="804" stroke="#35353C" stroke-width="1"/><text x="821.0526315789474" y="824" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#8A8A91" text-anchor="middle">0:40</text><line x1="913.6842105263158" y1="796" x2="913.6842105263158" y2="804" stroke="#35353C" stroke-width="1"/><line x1="1006.3157894736842" y1="796" x2="1006.3157894736842" y2="804" stroke="#35353C" stroke-width="1"/><text x="1006.3157894736842" y="824" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#8A8A91" text-anchor="middle">0:50</text><line x1="1098.9473684210525" y1="796" x2="1098.9473684210525" y2="804" stroke="#35353C" stroke-width="1"/><line x1="1191.578947368421" y1="796" x2="1191.578947368421" y2="804" stroke="#35353C" stroke-width="1"/><text x="1191.578947368421" y="824" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#8A8A91" text-anchor="middle">1:00</text><line x1="1284.2105263157894" y1="796" x2="1284.2105263157894" y2="804" stroke="#35353C" stroke-width="1"/><line x1="1376.842105263158" y1="796" x2="1376.842105263158" y2="804" stroke="#35353C" stroke-width="1"/><text x="1376.842105263158" y="824" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#8A8A91" text-anchor="middle">1:10</text><line x1="1469.4736842105262" y1="796" x2="1469.4736842105262" y2="804" stroke="#35353C" stroke-width="1"/><line x1="1562.1052631578948" y1="796" x2="1562.1052631578948" y2="804" stroke="#35353C" stroke-width="1"/><text x="1562.1052631578948" y="824" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#8A8A91" text-anchor="middle">1:20</text><line x1="1654.7368421052631" y1="796" x2="1654.7368421052631" y2="804" stroke="#35353C" stroke-width="1"/><line x1="1747.3684210526317" y1="796" x2="1747.3684210526317" y2="804" stroke="#35353C" stroke-width="1"/><text x="1747.3684210526317" y="824" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#8A8A91" text-anchor="middle">1:30</text><line x1="1840" y1="796" x2="1840" y2="804" stroke="#35353C" stroke-width="1"/><rect x="570.9473684210527" y="700" width="111.15789473684197" height="14" fill="#F2F2F0" opacity="0.9"/><rect x="848.8421052631579" y="700" width="74.10526315789468" height="14" fill="#F2F2F0" opacity="0.9"/><rect x="1006.3157894736842" y="700" width="83.36842105263167" height="14" fill="#F2F2F0" opacity="0.9"/><rect x="1589.8947368421052" y="700" width="157.47368421052647" height="14" fill="#F2F2F0" opacity="0.9"/><rect x="80" y="700" width="1760" height="14" fill="none" stroke="#35353C" stroke-width="1"/><rect x="81" y="724" width="155.47368421052633" height="60" rx="6" fill="#E2634A" stroke="#E2634A" stroke-width="1" fill-opacity="0.16"/><text x="87" y="746" font-family="Archivo" font-size="15" font-weight="400" fill="#F2F2F0">Problem, typed</text><rect x="238.47368421052633" y="724" width="62.84210526315789" height="60" rx="6" fill="#D9A441" stroke="#D9A441" stroke-width="1" fill-opacity="0.16"/><text x="244.47368421052633" y="746" font-family="Archivo" font-size="12" font-weight="400" fill="#F2F2F0">Stop →</text><text x="244.47368421052633" y="763" font-family="Archivo" font-size="12" font-weight="400" fill="#F2F2F0">assembling</text><rect x="303.3157894736842" y="724" width="127.68421052631578" height="60" rx="6" fill="#3EAF75" stroke="#3EAF75" stroke-width="1" fill-opacity="0.16"/><text x="309.3157894736842" y="746" font-family="Archivo" font-size="12" font-weight="400" fill="#F2F2F0">Meet [mark] brew +</text><text x="309.3157894736842" y="763" font-family="Archivo" font-size="12" font-weight="400" fill="#F2F2F0">line</text><rect x="433" y="724" width="53.57894736842104" height="60" rx="6" fill="#3FB8C4" stroke="#3FB8C4" stroke-width="1" fill-opacity="0.16"/><text x="439" y="746" font-family="Archivo" font-size="12" font-weight="400" fill="#F2F2F0">Reveal</text><rect x="488.57894736842104" y="724" width="553.7894736842106" height="60" rx="6" fill="#E2634A" stroke="#E2634A" stroke-width="1" fill-opacity="0.16"/><text x="494.57894736842104" y="746" font-family="Archivo" font-size="15" font-weight="400" fill="#F2F2F0">We make it: topic → 6 s production panel → { frame by frame } → [ a</text><text x="494.57894736842104" y="766" font-family="Archivo" font-size="15" font-weight="400" fill="#F2F2F0">finished file ]</text><rect x="1044.3684210526317" y="724" width="359.26315789473665" height="60" rx="6" fill="#D9A441" stroke="#D9A441" stroke-width="1" fill-opacity="0.16"/><text x="1050.3684210526317" y="746" font-family="Archivo" font-size="15" font-weight="400" fill="#F2F2F0">You drive it: menu → macro shot field →</text><text x="1050.3684210526317" y="766" font-family="Archivo" font-size="15" font-weight="400" fill="#F2F2F0">takes → UGC steps → languages</text><rect x="1405.6315789473683" y="724" width="183.26315789473688" height="60" rx="6" fill="#3EAF75" stroke="#3EAF75" stroke-width="1" fill-opacity="0.16"/><text x="1411.6315789473683" y="746" font-family="Archivo" font-size="15" font-weight="400" fill="#F2F2F0">Contrast + logo</text><rect x="1590.8947368421052" y="724" width="155.47368421052647" height="60" rx="6" fill="#3FB8C4" stroke="#3FB8C4" stroke-width="1" fill-opacity="0.16"/><text x="1596.8947368421052" y="746" font-family="Archivo" font-size="15" font-weight="400" fill="#F2F2F0">Dark: tagline +</text><text x="1596.8947368421052" y="766" font-family="Archivo" font-size="15" font-weight="400" fill="#F2F2F0">CTA</text><text x="80" y="900" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#8A8A91" letter-spacing="2">LIGHT/DARK STRIP: WHITE BLOCKS ABOVE EACH LANE MARK THE DARK BEATS</text><text x="80" y="990" font-family="IBM Plex Mono" font-size="14" font-weight="500" fill="#3EAF75" letter-spacing="3">VELOCITY RULES (APPLY TO EVERY SHOT)</text><text x="80" y="1050" font-family="Archivo" font-size="26" font-weight="600" fill="#F2F2F0">Type</text><text x="340" y="1050" font-family="Archivo" font-size="22" font-weight="400" fill="#B4B4B8">Captions type at ~10 characters/s, hold 1.5–2 s once complete. One line on screen at a time.</text><text x="80" y="1158" font-family="Archivo" font-size="26" font-weight="600" fill="#F2F2F0">Big words</text><text x="340" y="1158" font-family="Archivo" font-size="22" font-weight="400" fill="#B4B4B8">Arrive in ≤ 6 frames with directional blur, hold ~1 s, leave the same way. Only &quot;Stop&quot;, &quot;Meet&quot;,</text><text x="340" y="1190" font-family="Archivo" font-size="22" font-weight="400" fill="#B4B4B8">&quot;Delivered&quot;, &quot;And&quot;.</text><text x="80" y="1266" font-family="Archivo" font-size="26" font-weight="600" fill="#F2F2F0">Product UI</text><text x="340" y="1266" font-family="Archivo" font-size="22" font-weight="400" fill="#B4B4B8">Never cut mid-feature. Slow continuous camera, ~3–5% push per second; cursor travels ~600 px/s with</text><text x="340" y="1298" font-family="Archivo" font-size="22" font-weight="400" fill="#B4B4B8">ease-in-out; one click every 1–2 s.</text><text x="80" y="1374" font-family="Archivo" font-size="26" font-weight="600" fill="#F2F2F0">Transitions</text><text x="340" y="1374" font-family="Archivo" font-size="22" font-weight="400" fill="#B4B4B8">Focus pulls and blur dissolves of 0.3–0.5 s; shape morphs (phrase → bar → card header, brackets</text><text x="340" y="1406" font-family="Archivo" font-size="22" font-weight="400" fill="#B4B4B8">fly-through) of ~0.5 s.</text><text x="80" y="1482" font-family="Archivo" font-size="26" font-weight="600" fill="#F2F2F0">Holds</text><text x="340" y="1482" font-family="Archivo" font-size="22" font-weight="400" fill="#B4B4B8">The system panel and the step builder are the longest beats (5–6 s). The film breathes there; about</text><text x="340" y="1514" font-family="Archivo" font-size="22" font-weight="400" fill="#B4B4B8">a third of the runtime is calm UI building.</text><text x="80" y="1590" font-family="Archivo" font-size="26" font-weight="600" fill="#F2F2F0">Music</text><text x="340" y="1590" font-family="Archivo" font-size="22" font-weight="400" fill="#B4B4B8">Starts under &quot;Meet&quot;. Thins to a pad for the review beat, returns for &quot;You drive it&quot;, resolves on the</text><text x="340" y="1622" font-family="Archivo" font-size="22" font-weight="400" fill="#B4B4B8">logo and holds through the CTA.</text></svg>
