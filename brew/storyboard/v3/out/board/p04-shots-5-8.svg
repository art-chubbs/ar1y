ize="16" font-weight="400" fill="#B4B4B8">&quot;Stop&quot;.</text><text x="80" y="796.5" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#3EAF75" letter-spacing="2">VO</text><text x="170" y="796.5" font-family="Archivo" font-size="16" font-weight="400" fill="#F2F2F0">—</text><text x="80" y="826.5" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#8A8A91" letter-spacing="2">SFX</text><text x="170" y="826.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">Sub drop + whoosh hit.</text><text x="80" y="856.5" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#8A8A91" letter-spacing="2">NEXT</text><text x="170" y="856.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">&quot;Stop assembling videos.&quot; types beside it as it shrinks.</text><g transform="translate(1000 140) scale(0.4375)"><g clip-path="url(#w06-panel)"><rect x="0" y="0" width="1920" height="1080" fill="#F4F4F1"/><ellipse cx="1500" cy="1150" rx="1300" ry="620" fill="url(#w06-rg0)"/><ellipse cx="400" cy="1190" rx="900" ry="420" fill="url(#w06-rg1)"/><ellipse cx="760" cy="360" rx="1100" ry="520" fill="url(#w06-rg2)"/><text x="562.5" y="560" font-family="Archivo" font-size="72" font-weight="500" fill="#0B0B0C">Stop </text><text x="731.1" y="560" font-family="Archivo" font-size="72" font-weight="500" fill="#0B0B0C" opacity="0.6">assembling </text><text x="1121.2" y="560" font-family="Archivo" font-size="72" font-weight="500" fill="#0B0B0C" opacity="0.35">videos.</text><path d="M 260 900 C 700 500, 1200 380, 1760 300" fill="none" stroke="#3EAF75" stroke-width="2" opacity="0.4"/><text x="48" y="1044" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A8A91" letter-spacing="2">V3 · SHOT 06 — &quot;STOP ASSEMBLING VIDEOS.&quot;</text><text x="1872" y="1044" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A8A91" text-anchor="end" letter-spacing="2">0:10 · 2.0 S · THE PROBLEM</text>