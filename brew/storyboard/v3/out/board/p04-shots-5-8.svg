A91" letter-spacing="2">NEXT</text><text x="1090" y="856.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">Background floods into the brew gradient; &quot;Meet&quot; pulls focus.</text><g transform="translate(80 980) scale(0.4375)"><g clip-path="url(#w07-panel)"><rect x="0" y="0" width="1920" height="1080" fill="#F4F4F1"/><ellipse cx="1500" cy="1080" rx="1300" ry="620" fill="url(#w07-rg0)"/><ellipse cx="400" cy="1120" rx="900" ry="420" fill="url(#w07-rg1)"/><ellipse cx="760" cy="360" rx="1100" ry="520" fill="url(#w07-rg2)"/><g><text x="560" y="690" font-family="Archivo" font-size="300" font-weight="500" fill="#0B0B0C" letter-spacing="-9">Me</text></g><g filter="url(#w07-blur3)"><text x="962" y="690" font-family="Archivo" font-size="300" font-weight="500" fill="#3EAF75" letter-spacing="-9">et</text></g><text x="48" y="1044" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A8A91" letter-spacing="2">V3 · SHOT 07 — &quot;MEET&quot; FOCUS PULL</text><text x="1872" y="1044" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A8A91" text-anchor="end" letter-spacing="2">0:12 · 1.5 S · MEET BREW</text></g></g><rect x="80" y="980" width="840" height="472.5" rx="10" fill="none" stroke="#35353C" stroke-width="1"/><text x="80" y="1496.5" font-family="IBM Plex Mono" font-size="26" font-weight="500" fill="#3EAF75">07</text><text x="132" y="1496.5" font-family="Bricolage Grotesque" font-size="26" font-weight="700" fill="#F2F2F0" letter-spacing="-0.5">&quot;Meet&quot; focus pull</text><text x="920" y="1496.5" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#8A8A91" text-anchor="end">0:12 · 1.5 s</text><text x="80" y="1532.5" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#8A8A91" letter-spacing="2">VISUAL</text><text x="170" y="1532.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">The gradient takes over: off-white top, green → teal glow rising from below. &quot;Meet&quot;</text><text x="170" y="1554.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">pulls into focus left to right: M sharp, &quot;et&quot; still soft.</text><text x="80" y="1584.5" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#8A8A91" letter-spacing="2">MOTION</text><text x="170" y="1584.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">Rack focus across the word in 600 ms. Glow breathes up 5%. Ref: Numtera's thumbnail</text><text x="170" y="1606.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">&quot;Meet&quot;.</text><text x="80" y="1636.5" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#3EAF75" letter-spacing="2">VO</text><text x="170" y="1636.5" font-family="Archivo" font-size="16" font-weight="400" fill="#F2F2F0">&quot;Meet…&quot;</text><text x="80" y="1666.5" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#8A8A91" letter-spacing="2">SFX</text><text x="170" y="1666.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">Music enters: warm pad + light pulse.</text><text x="80" y="1696.5" font-family="IBM Plex Mono" font-size="11" font-weight="500" fill="#8A8A91" letter-spacing="2">NEXT</text><text x="170" y="1696.5" font-family="Archivo" font-size="16" font-weight="400" fill="#B4B4B8">Word shrinks left; the brew mark slides in after it.</text><g transform="translate(1000 980) scale(0.4375)"><g clip-path="url(#w08-panel)"><rect x="0" y="0" width="1920" height="1080" fill="#F4F4F1"/><ellipse cx="1500" cy="1080" rx="1300" ry="620" fill="url(#w08-rg0)"/><ellipse cx="400" cy="1120" rx="900" ry="420" fill="url(#w08-rg1)"/><ellipse cx="760" cy="360" rx="1100" ry="520" fill="url(#w08-rg2)"/><text x="559.3268" y="600" font-family="Archivo" font-size="120" font-weight="500" fill="#0B0B0C" letter-spacing="-3">Meet</text><rect x="870.4068" y="482" width="150" height="150" rx="30" fill="#FFFFFF"/><path d="M892.4068 528V504