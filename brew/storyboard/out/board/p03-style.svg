<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1820" viewBox="0 0 1920 1820"><defs></defs><rect x="0" y="0" width="1920" height="1820" fill="#0B0B0C"/><text x="80" y="74" font-family="Bricolage Grotesque" font-size="40" font-weight="800" fill="#F2F2F0" letter-spacing="-1"><tspan>br</tspan><tspan fill="#3EAF75">e</tspan><tspan>w</tspan></text><text x="200" y="68" font-family="IBM Plex Mono" font-size="14" font-weight="500" fill="#8A8A91" letter-spacing="3">LAUNCH FILM · STORYBOARD V1</text><text x="1840" y="68" font-family="IBM Plex Mono" font-size="14" font-weight="500" fill="#8A8A91" text-anchor="end" letter-spacing="3">STYLE &amp; MOTION   03</text><line x1="80" y1="104" x2="1840" y2="104" stroke="#35353C" stroke-width="1"/><text x="80" y="220" font-family="Bricolage Grotesque" font-size="72" font-weight="700" fill="#F2F2F0" letter-spacing="-2">Style &amp; motion</text><text x="80" y="300" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A8A91" letter-spacing="2">PALETTE (FROM SCALEWITHBREW.COM)</text><rect x="80" y="330" width="176" height="120" rx="10" fill="#0B0B0C" stroke="#35353C" stroke-width="1"/><text x="80" y="486" font-family="Archivo" font-size="20" font-weight="600" fill="#F2F2F0">Ground</text><text x="80" y="512" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#8A8A91">#0B0B0C</text><rect x="276" y="330" width="176" height="120" rx="10" fill="#131316" stroke="#35353C" stroke-width="1"/><text x="276" y="486" font-family="Archivo" font-size="20" font-weight="600" fill="#F2F2F0">Surface</text><text x="276" y="512" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#8A8A91">#131316</text><rect x="472" y="330" width="176" height="120" rx="10" fill="#35353C" stroke="#35353C" stroke-width="1"/><text x="472" y="486" font-family="Archivo" font-size="20" font-weight="600" fill="#F2F2F0">Line</text><text x="472" y="512" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#8A8A91">#35353C</text><rect x="668" y="330" width="176" height="120" rx="10" fill="#F2F2F0" stroke="#35353C" stroke-width="1"/><text x="668" y="486" font-family="Archivo" font-size="20" font-weight="600" fill="#F2F2F0">Text</text><text x="668" y="512" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#8A8A91">#F2F2F0</text><rect x="864" y="330" width="176" height="120" rx="10" fill="#8A8A91" stroke="#35353C" stroke-width="1"/><text x="864" y="486" font-family="Archivo" font-size="20" font-weight="600" fill="#F2F2F0">Text 3</text><text x="864" y="512" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#8A8A91">#8A8A91</text><rect x="1060" y="330" width="176" height="120" rx="10" fill="#3EAF75" stroke="#35353C" stroke-width="1"/><text x="1060" y="486" font-family="Archivo" font-size="20" font-weight="600" fill="#F2F2F0">Brand green</text><text x="1060" y="512" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#8A8A91">#3EAF75</text><rect x="1256" y="330" width="176" height="120" rx="10" fill="#D9A441" stroke="#35353C" stroke-width="1"/><text x="1256" y="486" font-family="Archivo" font-size="20" font-weight="600" fill="#F2F2F0">YouTube</text><text x="1256" y="512" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#8A8A91">#D9A441</text><rect x="1452" y="330" width="176" height="120" rx="10" fill="#3FB8C4" stroke="#35353C" stroke-width="1"/><text x="1452" y="486" font-family="Archivo" font-size="20" font-weight="600" fill="#F2F2F0">AI b-roll</text><text x="1452" y="512" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#8A8A91">#3FB8C4</text><rect x="1648" y="330" width="176" height="120" rx="10" fill="#E2634A" stroke="#35353C" stroke-width="1"/><text x="1648" y="486" font-family="Archivo" font-size="20" font-weight="600" fill="#F2F2F0">UGC</text><text x="1648" y="512" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#8A8A91">#E2634A</text><text x="80" y="560" font-family="Archivo" font-size="18" font-weight="400" fill="#8A8A91">Green is reserved for brew moments, active states and success. Amber, teal and coral appear only inside their product scenes, exactly as the</text><text x="80" y="584" font-family="Archivo" font-size="18" font-weight="400" fill="#8A8A91">site colour-codes them.</text><text x="80" y="660" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A8A91" letter-spacing="2">TYPE</text><text x="80" y="780" font-family="Bricolage Grotesque" font-size="84" font-weight="500" fill="#F2F2F0" letter-spacing="-3"><tspan>We make the </tspan><tspan font-weight="800">whole</tspan><tspan> video.</tspan></text><text x="80" y="850" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#8A8A91">Bricolage Grotesque 500–800 · headlines, tight tracking (−2 to −5)</text><text x="80" y="920" font-family="Archivo" font-size="36" font-weight="400" fill="#F2F2F0">Archivo 400–600 · UI text, captions, body</text><text x="80" y="980" font-family="IBM Plex Mono" font-size="26" font-weight="500" fill="#B4B4B8" letter-spacing="2">IBM PLEX MONO 500 · LABELS · TIMECODE 00:00:33:00</text><text x="1100" y="660" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A8A91" letter-spacing="2">SIGNATURE DEVICE: THE VIEWFINDER</text><path d="M1100 724V690H1134M1366 690H1400V724M1400 846V880H1366M1134 880H1100V846" fill="none" stroke="#3EAF75" stroke-width="6" stroke-linecap="square"/><text x="1250" y="810" font-family="Bricolage Grotesque" font-size="72" font-weight="800" fill="#F2F2F0" text-anchor="middle" letter-spacing="-3"><tspan>br</tspan><tspan fill="#3EAF75">e</tspan><tspan>w</tspan></text><text x="1440" y="720" font-family="Archivo" font-size="19" font-weight="400" fill="#B4B4B8">The four green corners from brew's</text><text x="1440" y="748" font-family="Archivo" font-size="19" font-weight="400" fill="#B4B4B8">logo are &quot;a person looking&quot;. They</text><text x="1440" y="776" font-family="Archivo" font-size="19" font-weight="400" fill="#B4B4B8">frame the chaos, lock onto the</text><text x="1440" y="804" font-family="Archivo" font-size="19" font-weight="400" fill="#B4B4B8">right shot, pick the thumbnail</text><text x="1440" y="832" font-family="Archivo" font-size="19" font-weight="400" fill="#B4B4B8">frame, and carry the logo.</text><text x="80" y="1080" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A8A91" letter-spacing="2">MOTION: EASING FROM THE SITE'S CSS</text><rect x="80" y="1120" width="200" height="200" rx="8" fill="none" stroke="#35353C" stroke-width="1"/><path d="M80 1320 C112 1120 140 1120 280 1120" fill="none" stroke="#3EAF75" stroke-width="3"/><text x="300" y="1150" font-family="Archivo" font-size="22" font-weight="600" fill="#F2F2F0">e-out</text><text x="300" y="1178" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#8A8A91">.16,1,.3,1</text><text x="300" y="1212" font-family="Archivo" font-size="15" font-weight="400" fill="#8A8A91">Everything</text><text x="300" y="1232" font-family="Archivo" font-size="15" font-weight="400" fill="#8A8A91">entering</text><rect x="440" y="1120" width="200" height="200" rx="8" fill="none" stroke="#35353C" stroke-width="1"/><path d="M440 1320 C570 1320 510 1120 640 1120" fill="none" stroke="#3EAF75" stroke-width="3"/><text x="660" y="1150" font-family="Archivo" font-size="22" font-weight="600" fill="#F2F2F0">in-out</text><text x="660" y="1178" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#8A8A91">.65,0,.35,1</text><text x="660" y="1212" font-family="Archivo" font-size="15" font-weight="400" fill="#8A8A91">Camera moves,</text><text x="660" y="1232" font-family="Archivo" font-size="15" font-weight="400" fill="#8A8A91">compressions</text><rect x="800" y="1120" width="200" height="200" rx="8" fill="none" stroke="#35353C" stroke-width="1"/><path d="M800 1320 C868 1030 928 1120 1000 1120" fill="none" stroke="#3EAF75" stroke-width="3"/><text x="1020" y="1150" font-family="Archivo" font-size="22" font-weight="600" fill="#F2F2F0">overshoot</text><text x="1020" y="1178" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#8A8A91">.34,1.45,.64,1</text><text x="1020" y="1212" font-family="Archivo" font-size="15" font-weight="400" fill="#8A8A91">Bracket locks,</text><text x="1020" y="1232" font-family="Archivo" font-size="15" font-weight="400" fill="#8A8A91">the green &quot;e&quot;</text><text x="1180" y="1130" font-family="Archivo" font-size="20" font-weight="400" fill="#B4B4B8">Rhythm: Act I accelerates into chaos, hard freeze,</text><text x="1180" y="1160" font-family="Archivo" font-size="20" font-weight="400" fill="#B4B4B8">then everything after is smooth, modular and</text><text x="1180" y="1190" font-family="Archivo" font-size="20" font-weight="400" fill="#B4B4B8">predictable. 40 ms stagger on every list. The only</text><text x="1180" y="1220" font-family="Archivo" font-size="20" font-weight="400" fill="#B4B4B8">slow-motion is Act IV, where a person reviews, so</text><text x="1180" y="1250" font-family="Archivo" font-size="20" font-weight="400" fill="#B4B4B8">the slowdown itself means &quot;care&quot;.</text><text x="80" y="1420" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A8A91" letter-spacing="2">TRANSITION CHAIN: ONE OBJECT, TRANSFORMED, NEVER CUT</text><rect x="80" y="1450" width="113.5" height="29" rx="14.5" fill="#3EAF75" stroke="#3EAF75" stroke-width="1.2" fill-opacity="0.14"/><text x="94" y="1468.82" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#3EAF75" letter-spacing="1.5">TOPIC LINE</text><text x="204.5" y="1470" font-family="Archivo" font-size="16" font-weight="400" fill="#8A8A91">→</text><rect x="223.5" y="1450" width="130.89999999999998" height="29" rx="14.5" fill="none" stroke="#35353C" stroke-width="1"/><text x="237.5" y="1468.82" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#B4B4B8" letter-spacing="1.5">SOURCE CARDS</text><text x="365.4" y="1470" font-family="Archivo" font-size="16" font-weight="400" fill="#8A8A91">→</text><rect x="384.4" y="1450" width="130.89999999999998" height="29" rx="14.5" fill="none" stroke="#35353C" stroke-width="1"/><text x="398.4" y="1468.82" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#B4B4B8" letter-spacing="1.5">SCRIPT LINES</text><text x="526.3" y="1470" font-family="Archivo" font-size="16" font-weight="400" fill="#8A8A91">→</text><rect x="545.3" y="1450" width="96.1" height="29" rx="14.5" fill="none" stroke="#35353C" stroke-width="1"/><text x="559.3" y="1468.82" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#B4B4B8" letter-spacing="1.5">WAVEFORM</text><text x="652.4" y="1470" font-family="Archivo" font-size="16" font-weight="400" fill="#8A8A91">→</text><rect x="671.4" y="1450" width="96.1" height="29" rx="14.5" fill="none" stroke="#35353C" stroke-width="1"/><text x="685.4" y="1468.82" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#B4B4B8" letter-spacing="1.5">TIMELINE</text><text x="778.5" y="1470" font-family="Archivo" font-size="16" font-weight="400" fill="#8A8A91">→</text><rect x="797.5" y="1450" width="78.69999999999999" height="29" rx="14.5" fill="none" stroke="#35353C" stroke-width="1"/><text x="811.5" y="1468.82" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#B4B4B8" letter-spacing="1.5">PLAYER</text><text x="887.2" y="1470" font-family="Archivo" font-size="16" font-weight="400" fill="#8A8A91">→</text><rect x="906.2" y="1450" width="113.5" height="29" rx="14.5" fill="none" stroke="#35353C" stroke-width="1"/><text x="920.2" y="1468.82" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#B4B4B8" letter-spacing="1.5">VIDEO CARD</text><text x="1030.7" y="1470" font-family="Archivo" font-size="16" font-weight="400" fill="#8A8A91">→</text><rect x="1049.7" y="1450" width="78.69999999999999" height="29" rx="14.5" fill="none" stroke="#35353C" stroke-width="1"/><text x="1063.7" y="1468.82" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#B4B4B8" letter-spacing="1.5">PROMPT</text><text x="1139.4" y="1470" font-family="Archivo" font-size="16" font-weight="400" fill="#8A8A91">→</text><rect x="1158.4" y="1450" width="78.69999999999999" height="29" rx="14.5" fill="none" stroke="#35353C" stroke-width="1"/><text x="1172.4" y="1468.82" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#B4B4B8" letter-spacing="1.5">PHONES</text><text x="1248.1000000000001" y="1470" font-family="Archivo" font-size="16" font-weight="400" fill="#8A8A91">→</text><rect x="1267.1000000000001" y="1450" width="139.6" height="29" rx="14.5" fill="none" stroke="#35353C" stroke-width="1"/><text x="1281.1000000000001" y="1468.82" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#B4B4B8" letter-spacing="1.5">LANGUAGE GRID</text><text x="1417.7" y="1470" font-family="Archivo" font-size="16" font-weight="400" fill="#8A8A91">→</text><rect x="1436.7" y="1450" width="104.8" height="29" rx="14.5" fill="none" stroke="#35353C" stroke-width="1"/><text x="1450.7" y="1468.82" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#B4B4B8" letter-spacing="1.5">THUMBNAIL</text><text x="1552.5" y="1470" font-family="Archivo" font-size="16" font-weight="400" fill="#8A8A91">→</text><rect x="1571.5" y="1450" width="78.69999999999999" height="29" rx="14.5" fill="none" stroke="#35353C" stroke-width="1"/><text x="1585.5" y="1468.82" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#B4B4B8" letter-spacing="1.5">BUTTON</text><text x="1661.2" y="1470" font-family="Archivo" font-size="16" font-weight="400" fill="#8A8A91">→</text><rect x="1680.2" y="1450" width="61.3" height="29" rx="14.5" fill="#3EAF75" stroke="#3EAF75" stroke-width="1.2" fill-opacity="0.14"/><text x="1694.2" y="1468.82" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#3EAF75" letter-spacing="1.5">LOGO</text><text x="80" y="1560" font-family="Archivo" font-size="18" font-weight="400" fill="#8A8A91">Grain: very light, shifting (site uses grain-shift). Background: ground #0B0B0C with the site's faint 32 px dot grid; diagonal green &quot;aurora rake&quot;</text><text x="80" y="1588" font-family="Archivo" font-size="18" font-weight="400" fill="#8A8A91">only on brand moments (reveal, hero line, end card). No robots, glowing grids, brains or holograms.</text></svg>
