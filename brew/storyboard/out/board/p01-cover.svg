<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1820" viewBox="0 0 1920 1820"><defs></defs><rect x="0" y="0" width="1920" height="1820" fill="#0B0B0C"/><text x="80" y="74" font-family="Bricolage Grotesque" font-size="40" font-weight="800" fill="#F2F2F0" letter-spacing="-1"><tspan>br</tspan><tspan fill="#3EAF75">e</tspan><tspan>w</tspan></text><text x="200" y="68" font-family="IBM Plex Mono" font-size="14" font-weight="500" fill="#8A8A91" letter-spacing="3">LAUNCH FILM · STORYBOARD V1</text><text x="1840" y="68" font-family="IBM Plex Mono" font-size="14" font-weight="500" fill="#8A8A91" text-anchor="end" letter-spacing="3">COVER   01</text><line x1="80" y1="104" x2="1840" y2="104" stroke="#35353C" stroke-width="1"/><text x="80" y="220" font-family="IBM Plex Mono" font-size="16" font-weight="500" fill="#3EAF75" letter-spacing="3">BREW · SCALE WITH BREW · 72-SECOND LAUNCH FILM</text><text x="80" y="380" font-family="Bricolage Grotesque" font-size="124" font-weight="700" fill="#F2F2F0" letter-spacing="-4">From idea to upload,</text><text x="80" y="508" font-family="Bricolage Grotesque" font-size="124" font-weight="700" fill="#F2F2F0" letter-spacing="-4">without the production</text><text x="80" y="636" font-family="Bricolage Grotesque" font-size="124" font-weight="700" fill="#3EAF75" letter-spacing="-4">in between.</text><text x="80" y="800" font-family="IBM Plex Mono" font-size="16" font-weight="500" fill="#8A8A91" letter-spacing="2">72 S · 16:9 MASTER (9:16 CUTDOWN LATER) · 29 FRAMES · 6 ACTS · 24 FPS</text><rect x="82" y="880" width="142.66666666666666" height="16" rx="4" fill="#E2634A" opacity="1"/><text x="84" y="940" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#8A8A91" letter-spacing="2">I · 0:00–0:06</text><text x="84" y="976" font-family="Archivo" font-size="22" font-weight="600" fill="#F2F2F0">The loop</text><line x1="82" y1="904" x2="82" y2="918" stroke="#35353C" stroke-width="1"/><rect x="228.66666666666666" y="880" width="118.22222222222223" height="16" rx="4" fill="#3EAF75" opacity="1"/><text x="230.66666666666666" y="1020" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#8A8A91" letter-spacing="2">II · 0:06–0:11</text><text x="230.66666666666666" y="1056" font-family="Archivo" font-size="22" font-weight="600" fill="#F2F2F0">Freeze &amp; reveal</text><line x1="228.66666666666666" y1="904" x2="228.66666666666666" y2="998" stroke="#35353C" stroke-width="1"/><rect x="350.8888888888889" y="880" width="338.22222222222223" height="16" rx="4" fill="#B4B4B8" opacity="0.6"/><text x="352.8888888888889" y="940" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#8A8A91" letter-spacing="2">III · 0:11–0:25</text><text x="352.8888888888889" y="976" font-family="Archivo" font-size="22" font-weight="600" fill="#F2F2F0">The pipeline</text><line x1="350.8888888888889" y1="904" x2="350.8888888888889" y2="918" stroke="#35353C" stroke-width="1"/><rect x="693.1111111111111" y="880" width="216" height="16" rx="4" fill="#3EAF75" opacity="1"/><text x="695.1111111111111" y="1020" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#8A8A91" letter-spacing="2">IV · 0:25–0:34</text><text x="695.1111111111111" y="1056" font-family="Archivo" font-size="22" font-weight="600" fill="#F2F2F0">A person watches</text><line x1="693.1111111111111" y1="904" x2="693.1111111111111" y2="998" stroke="#35353C" stroke-width="1"/><rect x="913.1111111111111" y="880" width="753.7777777777778" height="16" rx="4" fill="#D9A441" opacity="1"/><text x="915.1111111111111" y="940" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#8A8A91" letter-spacing="2">V · 0:34–1:05</text><text x="915.1111111111111" y="976" font-family="Archivo" font-size="22" font-weight="600" fill="#F2F2F0">What we make</text><line x1="913.1111111111111" y1="904" x2="913.1111111111111" y2="918" stroke="#35353C" stroke-width="1"/><rect x="1670.888888888889" y="880" width="167.11111111111111" height="16" rx="4" fill="#3EAF75" opacity="1"/><text x="1672.888888888889" y="1020" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#8A8A91" letter-spacing="2">VI · 1:05–1:12</text><text x="1672.888888888889" y="1056" font-family="Archivo" font-size="22" font-weight="600" fill="#F2F2F0">You approve</text><line x1="1670.888888888889" y1="904" x2="1670.888888888889" y2="998" stroke="#35353C" stroke-width="1"/><text x="80" y="1160" font-family="IBM Plex Mono" font-size="14" font-weight="500" fill="#8A8A91" letter-spacing="3">WHAT THE VIEWER SHOULD REMEMBER, IN ORDER</text><text x="80" y="1220" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#3EAF75">01</text><text x="140" y="1220" font-family="Archivo" font-size="34" font-weight="400" fill="#F2F2F0">brew makes the whole video for you.</text><text x="80" y="1282" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#3EAF75">02</text><text x="140" y="1282" font-family="Archivo" font-size="34" font-weight="400" fill="#F2F2F0">AI does the heavy lifting. A person watches every frame.</text><text x="80" y="1344" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#3EAF75">03</text><text x="140" y="1344" font-family="Archivo" font-size="34" font-weight="400" fill="#F2F2F0">YouTube videos, AI b-roll and UGC ads.</text><text x="80" y="1406" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#3EAF75">04</text><text x="140" y="1406" font-family="Archivo" font-size="34" font-weight="600" fill="#F2F2F0">You approve. You don't assemble.</text><text x="80" y="1468" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#3EAF75">05</text><text x="140" y="1468" font-family="Archivo" font-size="34" font-weight="400" fill="#F2F2F0">Your first video is free.</text><text x="1080" y="1160" font-family="IBM Plex Mono" font-size="14" font-weight="500" fill="#8A8A91" letter-spacing="3">BUILT FROM</text><text x="1080" y="1210" font-family="Archivo" font-size="22" font-weight="400" fill="#B4B4B8">The product brief and scalewithbrew.com, captured 1 Oct</text><text x="1080" y="1244" font-family="Archivo" font-size="22" font-weight="400" fill="#B4B4B8">2026. Colours, type, easing curves, the viewfinder</text><text x="1080" y="1278" font-family="Archivo" font-size="22" font-weight="400" fill="#B4B4B8">brackets, the pipeline pills and most on-screen copy are</text><text x="1080" y="1312" font-family="Archivo" font-size="22" font-weight="400" fill="#B4B4B8">lifted from the live site so the film looks and sounds</text><text x="1080" y="1346" font-family="Archivo" font-size="22" font-weight="400" fill="#B4B4B8">like brew.</text><text x="1080" y="1420" font-family="Archivo" font-size="22" font-weight="400" fill="#8A8A91">Corrected from the brief: the nine languages are EN DE FR</text><text x="1080" y="1454" font-family="Archivo" font-size="22" font-weight="400" fill="#8A8A91">ES PT IT PL ID DA (no Hindi or Korean). Added the free</text><text x="1080" y="1488" font-family="Archivo" font-size="22" font-weight="400" fill="#8A8A91">first video CTA and the &quot;Rose Freedman&quot; proof moment from</text><text x="1080" y="1522" font-family="Archivo" font-size="22" font-weight="400" fill="#8A8A91">the site.</text></svg>
