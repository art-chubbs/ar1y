<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1820" viewBox="0 0 1920 1820"><defs></defs><rect x="0" y="0" width="1920" height="1820" fill="#0B0B0C"/><text x="80" y="74" font-family="Bricolage Grotesque" font-size="40" font-weight="800" fill="#F2F2F0" letter-spacing="-1"><tspan>br</tspan><tspan fill="#3EAF75">e</tspan><tspan>w</tspan></text><text x="200" y="68" font-family="IBM Plex Mono" font-size="14" font-weight="500" fill="#8A8A91" letter-spacing="3">LAUNCH FILM · STORYBOARD V1</text><text x="1840" y="68" font-family="IBM Plex Mono" font-size="14" font-weight="500" fill="#8A8A91" text-anchor="end" letter-spacing="3">VOICEOVER SCRIPT   02</text><line x1="80" y1="104" x2="1840" y2="104" stroke="#35353C" stroke-width="1"/><text x="80" y="220" font-family="Bricolage Grotesque" font-size="72" font-weight="700" fill="#F2F2F0" letter-spacing="-2">Voiceover</text><text x="80" y="280" font-family="Archivo" font-size="22" font-weight="400" fill="#8A8A91">Tone: confident, conversational, dry. Not hyped. British spelling on screen. Roughly 115 words, read at ~140</text><text x="80" y="312" font-family="Archivo" font-size="22" font-weight="400" fill="#8A8A91">wpm with the deliberate pause on the freeze.</text><text x="80" y="400" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A8A91" letter-spacing="2">TIME</text><text x="260" y="400" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A8A91" letter-spacing="2">VOICEOVER</text><text x="1180" y="400" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A8A91" letter-spacing="2">ON SCREEN</text><line x1="80" y1="442" x2="1840" y2="442" stroke="#26262B" stroke-width="1"/><text x="80" y="480" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#3EAF75">0:00</text><text x="260" y="480" font-family="Archivo" font-size="28" font-weight="400" fill="#F2F2F0">Making one video is easy.</text><text x="1180" y="480" font-family="Archivo" font-size="22" font-weight="400" fill="#8A8A91">Making one video is easy.</text><line x1="80" y1="512" x2="1840" y2="512" stroke="#26262B" stroke-width="1"/><text x="80" y="550" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#3EAF75">0:03</text><text x="260" y="550" font-family="Archivo" font-size="28" font-weight="400" fill="#F2F2F0">Making fifty — week after week — is another story.</text><text x="1180" y="550" font-family="Archivo" font-size="22" font-weight="400" fill="#8A8A91">Making fifty is another story.</text><line x1="80" y1="582" x2="1840" y2="582" stroke="#26262B" stroke-width="1"/><text x="80" y="620" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#3EAF75">0:05</text><text x="260" y="620" font-family="Archivo" font-size="28" font-weight="400" fill="#8A8A91">(silence)</text><text x="1180" y="620" font-family="Archivo" font-size="22" font-weight="400" fill="#8A8A91">freeze</text><line x1="80" y1="652" x2="1840" y2="652" stroke="#26262B" stroke-width="1"/><text x="80" y="690" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#3EAF75">0:07</text><text x="260" y="690" font-family="Archivo" font-size="28" font-weight="400" fill="#F2F2F0">So hand it over.</text><line x1="80" y1="722" x2="1840" y2="722" stroke="#26262B" stroke-width="1"/><text x="80" y="760" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#3EAF75">0:09</text><text x="260" y="760" font-family="Archivo" font-size="28" font-weight="400" fill="#F2F2F0">We make the whole video.</text><text x="1180" y="760" font-family="Archivo" font-size="22" font-weight="400" fill="#8A8A91">brew · We make the whole video.</text><line x1="80" y1="792" x2="1840" y2="792" stroke="#26262B" stroke-width="1"/><text x="80" y="830" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#3EAF75">0:11</text><text x="260" y="830" font-family="Archivo" font-size="28" font-weight="400" fill="#F2F2F0">Send a topic, or a script. We research it, write it,</text><text x="260" y="866" font-family="Archivo" font-size="28" font-weight="400" fill="#F2F2F0">voice it, source every shot, and cut it.</text><text x="1180" y="830" font-family="Archivo" font-size="22" font-weight="400" fill="#8A8A91">TOPIC → RESEARCH → SCRIPT → VOICE → EDIT</text><line x1="80" y1="898" x2="1840" y2="898" stroke="#26262B" stroke-width="1"/><text x="80" y="936" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#3EAF75">0:25</text><text x="260" y="936" font-family="Archivo" font-size="28" font-weight="400" fill="#F2F2F0">Then a person watches all of it.</text><text x="1180" y="936" font-family="Archivo" font-size="22" font-weight="400" fill="#8A8A91">Review · frame by frame</text><line x1="80" y1="968" x2="1840" y2="968" stroke="#26262B" stroke-width="1"/><text x="80" y="1006" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#3EAF75">0:27</text><text x="260" y="1006" font-family="Archivo" font-size="28" font-weight="400" fill="#F2F2F0">An AI tool picks on mood. We find her.</text><text x="1180" y="1006" font-family="Archivo" font-size="22" font-weight="400" fill="#8A8A91">What tools make. What we make.</text><line x1="80" y1="1038" x2="1840" y2="1038" stroke="#26262B" stroke-width="1"/><text x="80" y="1076" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#3EAF75">0:31</text><text x="260" y="1076" font-family="Archivo" font-size="28" font-weight="400" fill="#F2F2F0">Every frame, before you ever see it.</text><text x="1180" y="1076" font-family="Archivo" font-size="22" font-weight="400" fill="#8A8A91">Every frame watched by a person.</text><line x1="80" y1="1108" x2="1840" y2="1108" stroke="#26262B" stroke-width="1"/><text x="80" y="1146" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#3EAF75">0:34</text><text x="260" y="1146" font-family="Archivo" font-size="28" font-weight="400" fill="#F2F2F0">Long-form YouTube, up to sixty minutes. Three days,</text><text x="260" y="1182" font-family="Archivo" font-size="28" font-weight="400" fill="#F2F2F0">start to finish.</text><text x="1180" y="1146" font-family="Archivo" font-size="22" font-weight="400" fill="#8A8A91">YouTube videos, done for you. · A file, not a</text><text x="1180" y="1182" font-family="Archivo" font-size="22" font-weight="400" fill="#8A8A91">first draft.</text><line x1="80" y1="1214" x2="1840" y2="1214" stroke="#26262B" stroke-width="1"/><text x="80" y="1252" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#3EAF75">0:43</text><text x="260" y="1252" font-family="Archivo" font-size="28" font-weight="400" fill="#F2F2F0">Need a shot that doesn't exist? Type it. Download it</text><text x="260" y="1288" font-family="Archivo" font-size="28" font-weight="400" fill="#F2F2F0">in minutes.</text><text x="1180" y="1252" font-family="Archivo" font-size="22" font-weight="400" fill="#8A8A91">AI b-roll, on demand. · Type the shot. Keep</text><text x="1180" y="1288" font-family="Archivo" font-size="22" font-weight="400" fill="#8A8A91">the shot.</text><line x1="80" y1="1320" x2="1840" y2="1320" stroke="#26262B" stroke-width="1"/><text x="80" y="1358" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#3EAF75">0:49</text><text x="260" y="1358" font-family="Archivo" font-size="28" font-weight="400" fill="#F2F2F0">Ads that look shot, not generated. Hooks, demos and</text><text x="260" y="1394" font-family="Archivo" font-size="28" font-weight="400" fill="#F2F2F0">payoffs, at the volume you actually test.</text><text x="1180" y="1358" font-family="Archivo" font-size="22" font-weight="400" fill="#8A8A91">Vertical ads that look shot, not generated.</text><line x1="80" y1="1426" x2="1840" y2="1426" stroke="#26262B" stroke-width="1"/><text x="80" y="1464" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#3EAF75">0:56</text><text x="260" y="1464" font-family="Archivo" font-size="28" font-weight="400" fill="#F2F2F0">And when a video works, upload it nine times, not</text><text x="260" y="1500" font-family="Archivo" font-size="28" font-weight="400" fill="#F2F2F0">once.</text><text x="1180" y="1464" font-family="Archivo" font-size="22" font-weight="400" fill="#8A8A91">Upload it nine times, not once.</text><line x1="80" y1="1532" x2="1840" y2="1532" stroke="#26262B" stroke-width="1"/><text x="80" y="1570" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#3EAF75">1:02</text><text x="260" y="1570" font-family="Archivo" font-size="28" font-weight="400" fill="#F2F2F0">Even the thumbnail is drawn by a person.</text><text x="1180" y="1570" font-family="Archivo" font-size="22" font-weight="400" fill="#8A8A91">Drawn by a person</text><line x1="80" y1="1602" x2="1840" y2="1602" stroke="#26262B" stroke-width="1"/><text x="80" y="1640" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#3EAF75">1:05</text><text x="260" y="1640" font-family="Archivo" font-size="28" font-weight="400" fill="#F2F2F0">You don't manage any of that.</text><text x="1180" y="1640" font-family="Archivo" font-size="22" font-weight="400" fill="#8A8A91">Send us a script →</text><line x1="80" y1="1672" x2="1840" y2="1672" stroke="#26262B" stroke-width="1"/><text x="80" y="1710" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#3EAF75">1:07</text><text x="260" y="1710" font-family="Archivo" font-size="28" font-weight="400" fill="#F2F2F0">You approve. You don't assemble.</text><text x="1180" y="1710" font-family="Archivo" font-size="22" font-weight="400" fill="#8A8A91">You approve. You don't assemble.</text><line x1="80" y1="1742" x2="1840" y2="1742" stroke="#26262B" stroke-width="1"/><text x="80" y="1780" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#3EAF75">1:09</text><text x="260" y="1780" font-family="Archivo" font-size="28" font-weight="400" fill="#F2F2F0">Your first video is free. brew.</text><text x="1180" y="1780" font-family="Archivo" font-size="22" font-weight="400" fill="#8A8A91">Your first video is free. scalewithbrew.com</text></svg>
