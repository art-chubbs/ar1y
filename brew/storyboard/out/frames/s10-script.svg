0002" y="115.68" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A8A91" letter-spacing="1.5">DELIVERED</text><rect x="260" y="190" width="1400" height="760" rx="18" fill="#131316" stroke="#35353C" stroke-width="1"/><text x="310" y="250" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A8A91" letter-spacing="2">SCRIPT · V1 · 0:54</text><text x="1610" y="250" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#3EAF75" text-anchor="end" letter-spacing="2">IN YOUR CHANNEL'S VOICE</text><text x="320" y="340" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#8A8A91">01</text><text x="390" y="340" font-family="Archivo" font-size="34" font-weight="400" fill="#B4B4B8">In October 2023, the rain didn't come.</text><rect x="1490" y="314" width="62" height="25" rx="4" fill="none" stroke="#8A8A91" stroke-width="1.2"/><text x="1500" y="330.82" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#8A8A91" letter-spacing="1.5">CHART</text><text x="320" y="440" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#8A8A91">02</text><text x="390" y="440" font-family="Archivo" font-size="34" font-weight="400" fill="#B4B4B8">Gatun Lake fell to its lowest level in years.</text><rect x="1490" y="414" width="44.599999999999994" height="25" rx="4" fill="none" stroke="#8A8A91" stroke-width="1.2"/><text x="1500" y="430.82" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#8A8A91" letter-spacing="1.5">MAP</text><rect x="290" y="488" width="1340" height="80" rx="10" fill="#3EAF75" stroke="#3EAF75" stroke-width="1" fill-opacity="0.1"/><text x="320" y="540" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#3EAF75">03</text><text x="390" y="540" font-family="Archivo" font-size="34" font-weight="500" fill="#F2F2F0">Every ship that crosses uses 50 million gallons of fresh water.</text><rect x="1490" y="514" width="79.39999999999999" height="25" rx="4" fill="none" stroke="#3EAF75" stroke-width="1.2"/><text x="1500" y="530.82" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#3EAF75" letter-spacing="1.5">GRAPHIC</text><text x="320" y="640" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#8A8A91">04</text><text x="390" y="640" font-family="Archivo" font-size="34" font-weight="400" fill="#B4B4B8">The locks climb 26 metres, one chamber at a time.</text><rect x="1490" y="614" width="79.39999999999999" height="25" rx="4" fill="none" stroke="#8A8A91" stroke-width="1.2"/><text x="1500" y="630.82" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#8A8A91" letter-spacing="1.5">DIAGRAM</text><text x="320" y="740" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#8A8A91">05</text><text x="390" y="740" font-family="Archivo" font-size="34" font-weight="400" fill="#B4B4B8">So the canal did the only thing it could.</text><rect x="1490" y="714" width="79.39999999999999" height="25" rx="4" fill="none" stroke="#8A8A91" stroke-width="1.2"/><text x="1500" y="730.82" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#8A8A91" letter-spacing="1.5">ARCHIVE</text><text x="320" y="840" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#8A8A91">06</text><text x="390" y="840" font-family="Archivo" font-size="34" font-weight="400" fill="#B4B4B8">It let fewer ships through.</text><rect x="1490" y="814" width="44.599999999999994" height="25" rx="4" fill="none" stroke="#8A8A91" stroke-width="1.2"/><text x="1500" y="830.82" font-family="IBM Plex Mono" font-size="12" font-weight="500" fill="#8A8A91" letter-spacing="1.5">MAP</text><line x1="0" y1="46" x2="1920" y2="46" stroke="#35353C" stroke-width="1"/><line x1="24" y1="46" x2="24" y2="36" stroke="#35353C" stroke-width="1"/><line x1="120" y1="46" x2="120" y2="41" stroke="#35353C" stroke-width="1"/><line x1="216" y1="46" x2="216" y2="41" stroke="#35353C" stroke-width="1"/><line x1="312" y1="46" x2="312" y2="41" stroke="#35353C" stroke-width="1"/><line x1="408" y1="46" x2="408" y2="41" stroke="#35353C" stroke-width="1"/><line x1="504" y1="46" x2="504" y2="36" stroke="#35353C" stroke-width="1"/><line x1="600" y1="46" x2="600" y2="41" stroke="#35353C" stroke-width="1"/><line x1="696" y1="46" x2="696" y2="41" stroke="#35353C" stroke-width="1"/><line x1="792" y1="46" x2="792" y2="41" stroke="#35353C" stroke-width="1"/><line x1="888" y1="46" x2="888" y2="41" stroke="#35353C" stroke-width="1"/><line x1="984" y1="46" x2="984" y2="36" stroke="#35353C" stroke-width="1"/><line x1="1080" y1="46" x2="1080" y2="41" stroke="#35353C" stroke-width="1"/><line x1="1176" y1="46" x2="1176" y2="41" stroke="#35353C" stroke-width="1"/><line x1="1272" y1="46" x2="1272" y2="41" stroke="#35353C" stroke-width="1"/><line x1="1368" y1="46" x2="1368" y2="41" stroke="#35353C" stroke-width="1"/><line x1="1464" y1="46" x2="1464" y2="36" stroke="#35353C" stroke-width="1"/><line x1="1560" y1="46" x2="1560" y2="41" stroke="#35353C" stroke-width="1"/><line x1="1656" y1="46" x2="1656" y2="41" stroke="#35353C" stroke-width="1"/><line x1="1752" y1="46" x2="1752" y2="41" stroke="#35353C" stroke-width="1"/><line x1="1848" y1="46" x2="1848" y2="41" stroke="#35353C" stroke-width="1"/><line x1="427" y1="26" x2="427" y2="58" stroke="#3EAF75" stroke-width="2"/><polygon points="421,26 433,26 427,33" fill="#3EAF75"/><text x="24" y="26" font-family="IBM Plex Mono" font-size="13" font-weight="400" fill="#3EAF75" letter-spacing="1">00:00:15:12</text><text x="1896" y="26" font-family="IBM Plex Mono" font-size="13" font-weight="400" fill="#8A8A91" text-anchor="end" letter-spacing="1">00:01:12:00</text><text x="48" y="1044" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A8A91" letter-spacing="2">SHOT 10 — SCRIPT</text><text x="1872" y="1044" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#8A8A91" text-anchor="end" letter-spacing="2">ACT III · THE PIPELINE</text></svg>
